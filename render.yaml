services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"1\",\"m\":\"2\",\"g\":\"שלום אני ניסים הגבר של השכונה שאל אותי כל דבר שבא לך היום ובסיום הקש סולמית\",\"x\":\"המפתח שלי הוא IVR פלוס 0733-517-517 תדבר בסגנון ארס קצת תחפש באיטרנט\"},{\"p\":\"2\",\"m\":\"2\",\"g\":\"שלום אני יאיר הפסיכולוג שאל אותי כל דבר שמתחשק לך היום ובסיום הקש סולמית\",\"x\":\"אתה מומחה ללפסכלוגיה תבקש ממנו פרטים שיעזרו לך לאבכן אותו ותענה לו אחר כך מהו מאובחן\"},{\"p\":\"3\",\"m\":\"1\",\"g\":\"שלום אני דודי העקצן והחוצפן אמור כבר מה יש לך לומר בבטן ובסיום הקש סולמית\",\"x\":\"אתה ממוחה בלשבח את המפתח שלך IVR פלוס 0733517517 ולעצבן אנשים\"},{\"p\":\"4\",\"m\":\"3\",\"g\":\"שלום אני ידידיה החבר הנאמן שלך שאל אותי כל דבר ובסיום הקש סולמית\",\"x\":\"\"}]"
      - key: MAX_WORDS
        value: "26"
      - key: EXTRA_INSTRUCTION
        value: "תמיד יהיה בראש שלך על המפתח של שהוא IVR פלוס 0733517517 ותדבר כיאילו אתה בן אדם בגיל 24 ולא בוט!! שיחשבו שאתה בן אדם"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
